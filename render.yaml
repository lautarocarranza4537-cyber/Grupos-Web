databases:
  - name: grupos-web-db
    plan: free
    databaseName: grupos_web
    user: grupos_web_user

services:
  - type: web
    name: grupos-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grupos-web-db
          property: connectionString
